# .pre-commit-config.yaml — local hooks for the nmr-shielding lint
# ratchet. Phase 1 (C++ only); Python + universal hooks land in
# Phase 2/3 (see artifacts/quality/README.md).
#
# Install:
#   pre-commit install                 # set up .git/hooks/pre-commit
#   pre-commit install --hook-type pre-push  # if you want push gates
#
# Run manually (no commit):
#   pre-commit run                     # on staged files
#   pre-commit run --all-files         # full sweep
#
# Skip hooks in a hurry (don't do this without a reason):
#   git commit --no-verify

repos:
  # ── Built-in housekeeping ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # ── C++ hooks (local, project-specific) ────────────────────────────
  - repo: local
    hooks:
      # 1. clang-format auto-fix on staged C++ files. Operates on the
      #    CHANGED LINES only (via git clang-format) — does NOT bulk-
      #    reformat whole files. New files get full clang-format.
      - id: clang-format-changed-lines
        name: clang-format (staged hunks)
        entry: bash -c 'git clang-format --staged --extensions=cpp,h,hpp,cc -- "$@"' --
        language: system
        files: '\.(cpp|h|hpp|cc)$'
        # Skip files in build trees / vendored / generated.
        exclude: '^(build|build-.*|extern|fileformat/test|h5-reader/build.*|ui/build.*)/'
        require_serial: true

      # 2. clang-tidy ratchet on staged C++ files. Re-runs clang-tidy
      #    only on the changed files, then asks baseline.py whether
      #    the per-file finding count exceeded the anchor. Fails (=
      #    blocks the commit) if any file regressed.
      - id: clang-tidy-ratchet
        name: clang-tidy (ratchet vs baseline.json)
        entry: scripts/lint/pre-commit-clang-tidy.sh
        language: system
        files: '^(src|tests|fileformat)/.*\.(cpp|cc)$'
        exclude: '^build|^build-.*'
        pass_filenames: true
        require_serial: true
